<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#11151d" />
  <title>Citron OS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="desktop" id="desktop" aria-label="Bureau Citron OS">
    <div class="wallpaper-glow glow-one"></div><div class="wallpaper-glow glow-two"></div>
    <header class="topbar">
      <button class="brand" id="startButton" aria-label="Ouvrir le menu démarrer"><svg class="citron-mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M11.1 6.1C7.2 6.2 3.8 8.6 2.8 12c-1.1 3.8 1.2 8.2 5.2 9.4 3.7 1.1 9.7.1 13.1-3.6 2.8-3 3.3-7 .7-9.5-2.4-2.2-6.6-3.1-10.7-2.2Z" fill="#d4e476" stroke="#f0f4bd" stroke-width=".8"/><path d="M11 6.2C10.8 3.4 13.2 1.3 17.7 1c-.3 3.7-2.7 5.8-6.7 5.2Z" fill="#95ad56" stroke="#bfd47a" stroke-width=".7"/><path d="M6 12.1c1.1-2 3-3.2 5-3.6" fill="none" stroke="#f3f6ce" stroke-linecap="round" stroke-width="1"/></svg><span>citron<span class="brand-os"> OS</span></span></button>
      <div class="top-center"><span class="status-dot"></span> Tout est à sa place <span class="top-separator">/</span> Bureau 01</div>
      <div class="top-right"><span class="weather">☀️ <span>18°</span></span><span class="top-divider"></span><span id="topClock">--:--</span><button class="avatar" title="Profil">E</button></div>
    </header>

    <nav class="desktop-icons" aria-label="Applications">
      <button class="desktop-icon" data-app="files"><span class="app-icon folder-icon">▰</span><span>Fichiers</span></button>
      <button class="desktop-icon" data-app="notes"><span class="app-icon notes-icon">▤</span><span>Notes</span></button>
      <button class="desktop-icon" data-app="browser"><span class="app-icon browser-icon">◎</span><span>Internet</span></button>
      <button class="desktop-icon" data-app="settings"><span class="app-icon settings-icon">⚙</span><span>Réglages</span></button>
    </nav>

    <section class="widget welcome-widget"><div class="widget-kicker"><span class="sun-mark">✳</span> MARDI 3 NOVEMBRE</div><div class="welcome-time" id="welcomeTime">--:--</div><div class="welcome-sub">Un nouvel espace, à votre image.</div><div class="widget-bottom"><span class="tiny-dot"></span> Votre bureau est prêt <span class="widget-arrow">↗</span></div></section>

    <section class="window hidden" id="appWindow" aria-label="Fenêtre d’application">
      <div class="window-titlebar" id="windowHandle"><div class="window-app-title"><span id="windowGlyph">▰</span><span id="windowTitle">Fichiers</span></div><div class="window-controls"><button class="window-control minimize" title="Réduire">−</button><button class="window-control maximize" title="Agrandir">□</button><button class="window-control close" title="Fermer">×</button></div></div>
      <div class="window-content" id="windowContent"></div>
    </section>

    <section class="start-menu hidden" id="startMenu"><div class="start-search"><span>⌕</span><input id="appSearch" placeholder="Rechercher une application…" /></div><div class="start-heading"><span>Applications</span><button id="allApps">Toutes les apps <span>→</span></button></div><div class="app-grid" id="appGrid"></div><div class="start-footer"><div class="profile-chip"><span class="avatar small">E</span><span><b>Ethan</b><small>Compte local</small></span></div><button class="power-button" title="Éteindre" id="powerButton">⏻</button></div></section>

    <aside class="notification hidden" id="notification"><span class="notification-check">✓</span><span><b id="noticeTitle">Bienvenue sur Citron OS</b><small id="noticeText">Votre espace de travail est prêt.</small></span><button id="noticeClose">×</button></aside>

    <footer class="taskbar"><button class="task-start" id="taskStart" title="Menu démarrer"><svg class="citron-mark mini" viewBox="0 0 28 28" aria-hidden="true"><path d="M11.1 6.1C7.2 6.2 3.8 8.6 2.8 12c-1.1 3.8 1.2 8.2 5.2 9.4 3.7 1.1 9.7.1 13.1-3.6 2.8-3 3.3-7 .7-9.5-2.4-2.2-6.6-3.1-10.7-2.2Z" fill="#d4e476" stroke="#f0f4bd" stroke-width=".8"/><path d="M11 6.2C10.8 3.4 13.2 1.3 17.7 1c-.3 3.7-2.7 5.8-6.7 5.2Z" fill="#95ad56" stroke="#bfd47a" stroke-width=".7"/><path d="M6 12.1c1.1-2 3-3.2 5-3.6" fill="none" stroke="#f3f6ce" stroke-linecap="round" stroke-width="1"/></svg></button><span class="taskbar-line"></span><div class="pinned-apps"><button class="pinned" data-app="files" title="Fichiers">▰</button><button class="pinned" data-app="browser" title="Internet">◎</button><button class="pinned" data-app="notes" title="Notes">▤</button><button class="pinned" data-app="calculator" title="Calculatrice">＋</button></div><div class="taskbar-spacer"></div><button class="tray" id="trayButton"><span class="tray-icons">⌃　◉　◖</span><span id="taskClock">--:--</span><span class="tray-date">03/11/2026</span></button><button class="show-desktop" title="Afficher le bureau"></button></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
